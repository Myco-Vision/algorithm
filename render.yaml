services:
  - type: web
    name: mycovision-ml
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: RETRAIN_API_KEY
        generateValue: true
      - key: MUSHROOM_CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: SPECIES_CONFIDENCE_THRESHOLD
        value: "0.65"
      - key: CALIBRATION_TEMPERATURE
        value: "1.4"
